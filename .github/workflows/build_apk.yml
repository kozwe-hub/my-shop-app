name: Build Chill Mal APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: flutter create --org com.kozwe.chillmal --project-name chill_mal temp_app && shopt -s dotglob nullglob && mv temp_app/* . && rmdir temp_app
      - run: sed -i 's/android:label="[^"]*"/android:label="Chill Mal"/g' android/app/src/main/AndroidManifest.xml
      - run: sed -i 's/gradle-.*-all\.zip/gradle-8.7-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: chill-mal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
