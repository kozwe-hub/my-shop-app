name: Build Chill Mal APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - run: |
          flutter create --org com.kozwe.chillmal --project-name chill_mal temp_app
          shopt -s dotglob nullglob
          mv temp_app/* .
          rmdir temp_app
          flutter pub add http

      - run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;

          const String kOrderApiUrl =
              'https://script.google.com/macros/s/AKfycbz8W3tGTts9RuSjKeRP2n57XtBu0OIpT2KU-ibKP8iaenus8VyJkcLLsAi46vGQwN-4AQ/exec';

          void main() {
            runApp(const ChillMalApp());
          }

          class ChillMalApp extends StatelessWidget {
            const ChillMalApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Chill Mal',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: Colors.deepOrange),
                  useMaterial3: true,
                ),
                home: const ShopHomePage(),
              );
            }
          }

          class Product {
            final String id;
            final String name;
            final String category;
            final double price;
            final String imageUrl;

            const Product({
              required this.id,
              required this.name,
              required this.category,
              required this.price,
              this.imageUrl = '',
            });

            factory Product.fromJson(Map<String, dynamic> json, int index) {
              final rawPrice = json['price'];
              final parsedPrice = rawPrice is num
                  ? rawPrice.toDouble()
                  : double.tryParse(rawPrice?.toString() ?? '') ?? 0.0;
              return Product(
                id: (json['id']?.toString().trim().isNotEmpty ?? false)
                    ? json['id'].toString().trim()
                    : 'p$index',
                name: (json['name']?.toString().trim().isNotEmpty ?? false)
                    ? json['name'].toString().trim()
                    : 'Item $index',
                category: (json['category']?.toString().trim().isNotEmpty ?? false)
                    ? json['category'].toString().trim()
                    : 'General',
                price: parsedPrice,
                imageUrl: json['imageUrl']?.toString().trim() ?? '',
              );
            }
          }

          class ShopHomePage extends StatefulWidget {
            const ShopHomePage({super.key});

            @override
            State<ShopHomePage> createState() => _ShopHomePageState();
          }

          class _ShopHomePageState extends State<ShopHomePage> {
            final List<Product> _fallbackProducts = const [
              Product(id: 'p1', name: 'Wireless Earbuds', category: 'Electronics', price: 24.99),
              Product(id: 'p2', name: 'Smart Watch Pro', category: 'Electronics', price: 49.99),
              Product(id: 'p3', name: 'Chill Hoodie', category: 'Fashion', price: 29.50),
              Product(id: 'p4', name: 'Running Sneakers', category: 'Fashion', price: 54.00),
              Product(id: 'p5', name: 'Cold Brew Pack', category: 'Food', price: 12.75),
              Product(id: 'p6', name: 'Snack Box Combo', category: 'Food', price: 15.00),
            ];

            List<Product> _products = [];
            bool _loadingProducts = true;
            final Map<String, int> _cart = {};
            String _selectedCategory = 'All';
            String _searchQuery = '';

            @override
            void initState() {
              super.initState();
              _products = List<Product>.from(_fallbackProducts);
              _fetchProductsFromSheet();
            }

            Future<void> _fetchProductsFromSheet() async {
              setState(() => _loadingProducts = true);
              try {
                final uri = Uri.parse('$kOrderApiUrl?action=products');
                final res = await http.get(uri);
                if (res.statusCode >= 200 && res.statusCode < 300) {
                  final decoded = jsonDecode(res.body);
                  if (decoded is Map<String, dynamic> && decoded['ok'] == true && decoded['products'] is List) {
                    final list = (decoded['products'] as List)
                        .asMap()
                        .entries
                        .map((e) => Product.fromJson(Map<String, dynamic>.from(e.value as Map), e.key + 1))
                        .toList();
                    if (list.isNotEmpty && mounted) {
                      setState(() {
                        _products = list;
                        if (!_categories.contains(_selectedCategory)) {
                          _selectedCategory = 'All';
                        }
                      });
                    }
                  }
                }
              } catch (_) {
                // Keep current or fallback products if offline
              } finally {
                if (mounted) {
                  setState(() => _loadingProducts = false);
                }
              }
            }

            List<String> get _categories {
              final set = <String>{'All'};
              for (final p in _products) {
                if (p.category.trim().isNotEmpty) {
                  set.add(p.category.trim());
                }
              }
              return set.toList();
            }

            List<Product> get _filteredProducts {
              return _products.where((item) {
                final matchesCategory = _selectedCategory == 'All' || item.category == _selectedCategory;
                final matchesSearch = item.name.toLowerCase().contains(_searchQuery.trim().toLowerCase());
                return matchesCategory && matchesSearch;
              }).toList();
            }

            int get _totalCartItems => _cart.values.fold(0, (sum, qty) => sum + qty);

            double get _totalCartPrice {
              double total = 0;
              _cart.forEach((productId, qty) {
                final product = _products.cast<Product?>().firstWhere(
                      (p) => p?.id == productId,
                      orElse: () => null,
                    );
                if (product != null) {
                  total += product.price * qty;
                }
              });
              return total;
            }

            void _addToCart(Product product) {
              setState(() {
                _cart[product.id] = (_cart[product.id] ?? 0) + 1;
              });
              ScaffoldMessenger.of(context).clearSnackBars();
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text('Added "${product.name}" to cart'),
                  duration: const Duration(seconds: 1),
                ),
              );
            }

            void _changeQty(String productId, int delta) {
              setState(() {
                final nextQty = (_cart[productId] ?? 0) + delta;
                if (nextQty <= 0) {
                  _cart.remove(productId);
                } else {
                  _cart[productId] = nextQty;
                }
              });
            }

            Future<void> _submitOrder(String customer, String phone) async {
              final itemsList = _cart.entries.map((entry) {
                final product = _products.cast<Product?>().firstWhere(
                      (p) => p?.id == entry.key,
                      orElse: () => null,
                    );
                final name = product?.name ?? entry.key;
                final price = product?.price ?? 0.0;
                return {
                  'id': entry.key,
                  'name': name,
                  'qty': entry.value,
                  'price': price,
                };
              }).toList();

              final payload = {
                'customer': customer.trim(),
                'phone': phone.trim(),
                'item': itemsList.map((e) => '${e['name']} x${e['qty']}').join(', '),
                'items': itemsList,
                'total': double.parse(_totalCartPrice.toStringAsFixed(2)),
                'status': 'NEW',
              };

              final res = await http.post(
                Uri.parse(kOrderApiUrl),
                headers: {'Content-Type': 'application/json'},
                body: jsonEncode(payload),
              );

              if (res.statusCode < 200 || res.statusCode >= 300) {
                throw Exception('HTTP ${res.statusCode}');
              }
            }

            void _openCartSheet() {
              final nameCtrl = TextEditingController();
              final phoneCtrl = TextEditingController();
              bool submitting = false;

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (ctx) {
                  return StatefulBuilder(
                    builder: (context, setModalState) {
                      void updateCart(String id, int delta) {
                        _changeQty(id, delta);
                        setModalState(() {});
                      }

                      final entries = _cart.entries.toList();
                      return Padding(
                        padding: EdgeInsets.fromLTRB(
                          16,
                          16,
                          16,
                          MediaQuery.of(context).viewInsets.bottom + 24,
                        ),
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [
                                const Text('Chill Mal Cart', style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold)),
                                Text('Items: $_totalCartItems', style: const TextStyle(fontWeight: FontWeight.w600)),
                              ],
                            ),
                            const Divider(height: 20),
                            if (entries.isEmpty)
                              const Padding(
                                padding: EdgeInsets.symmetric(vertical: 24),
                                child: Center(child: Text('Your cart is empty.')),
                              )
                            else ...[
                              ConstrainedBox(
                                constraints: const BoxConstraints(maxHeight: 200),
                                child: ListView.builder(
                                  shrinkWrap: true,
                                  itemCount: entries.length,
                                  itemBuilder: (context, index) {
                                    final id = entries[index].key;
                                    final qty = entries[index].value;
                                    final product = _products.cast<Product?>().firstWhere(
                                          (p) => p?.id == id,
                                          orElse: () => null,
                                        );
                                    final title = product?.name ?? id;
                                    final unitPrice = product?.price ?? 0.0;
                                    return ListTile(
                                      contentPadding: EdgeInsets.zero,
                                      leading: const Icon(Icons.shopping_bag_outlined),
                                      title: Text(title),
                                      subtitle: Text('\$${(unitPrice * qty).toStringAsFixed(2)}'),
                                      trailing: Row(
                                        mainAxisSize: MainAxisSize.min,
                                        children: [
                                          IconButton(
                                            icon: const Icon(Icons.remove_circle_outline),
                                            onPressed: submitting ? null : () => updateCart(id, -1),
                                          ),
                                          Text('$qty'),
                                          IconButton(
                                            icon: const Icon(Icons.add_circle_outline),
                                            onPressed: submitting ? null : () => updateCart(id, 1),
                                          ),
                                        ],
                                      ),
                                    );
                                  },
                                ),
                              ),
                              const SizedBox(height: 8),
                              TextField(
                                controller: nameCtrl,
                                enabled: !submitting,
                                decoration: const InputDecoration(
                                  labelText: 'Customer Name',
                                  border: OutlineInputBorder(),
                                  isDense: true,
                                ),
                              ),
                              const SizedBox(height: 8),
                              TextField(
                                controller: phoneCtrl,
                                enabled: !submitting,
                                keyboardType: TextInputType.phone,
                                decoration: const InputDecoration(
                                  labelText: 'Phone Number',
                                  border: OutlineInputBorder(),
                                  isDense: true,
                                ),
                              ),
                            ],
                            const Divider(height: 20),
                            Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [
                                const Text('Total', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                                Text(
                                  '\$${_totalCartPrice.toStringAsFixed(2)}',
                                  style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.deepOrange),
                                ),
                              ],
                            ),
                            const SizedBox(height: 12),
                            SizedBox(
                              width: double.infinity,
                              child: FilledButton(
                                onPressed: (entries.isEmpty || submitting)
                                    ? null
                                    : () async {
                                        setModalState(() => submitting = true);
                                        try {
                                          await _submitOrder(nameCtrl.text, phoneCtrl.text);
                                          if (!mounted) return;
                                          setState(() => _cart.clear());
                                          Navigator.pop(context);
                                          ScaffoldMessenger.of(this.context).showSnackBar(
                                            const SnackBar(content: Text('Order sent to Chill Mal!')),
                                          );
                                        } catch (e) {
                                          setModalState(() => submitting = false);
                                          ScaffoldMessenger.of(this.context).showSnackBar(
                                            SnackBar(content: Text('Failed to send order: $e')),
                                          );
                                        }
                                      },
                                child: Text(submitting ? 'Sending Order...' : 'Checkout Now'),
                              ),
                            ),
                          ],
                        ),
                      );
                    },
                  );
                },
              );
            }

            Widget _buildProductVisual(Product product) {
              if (product.imageUrl.startsWith('http://') || product.imageUrl.startsWith('https://')) {
                return ClipRRect(
                  borderRadius: BorderRadius.circular(8),
                  child: Image.network(
                    product.imageUrl,
                    height: 64,
                    width: 64,
                    fit: BoxFit.cover,
                    errorBuilder: (_, __, ___) => const Icon(Icons.inventory_2, size: 40, color: Colors.deepOrange),
                  ),
                );
              }
              return const Icon(Icons.inventory_2, size: 40, color: Colors.deepOrange);
            }

            @override
            Widget build(BuildContext context) {
              final items = _filteredProducts;
              final categories = _categories;
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Chill Mal'),
                  actions: [
                    IconButton(
                      onPressed: _loadingProducts ? null : _fetchProductsFromSheet,
                      tooltip: 'Sync products',
                      icon: _loadingProducts
                          ? const SizedBox(
                              width: 18,
                              height: 18,
                              child: CircularProgressIndicator(strokeWidth: 2),
                            )
                          : const Icon(Icons.refresh),
                    ),
                    IconButton(
                      onPressed: _openCartSheet,
                      icon: Badge(
                        isLabelVisible: _totalCartItems > 0,
                        label: Text('$_totalCartItems'),
                        child: const Icon(Icons.shopping_cart),
                      ),
                    ),
                    const SizedBox(width: 8),
                  ],
                ),
                body: Column(
                  children: [
                    Padding(
                      padding: const EdgeInsets.fromLTRB(12, 8, 12, 4),
                      child: TextField(
                        onChanged: (value) => setState(() => _searchQuery = value),
                        decoration: InputDecoration(
                          hintText: 'Search products...',
                          prefixIcon: const Icon(Icons.search),
                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                          isDense: true,
                        ),
                      ),
                    ),
                    SizedBox(
                      height: 48,
                      child: ListView.separated(
                        padding: const EdgeInsets.symmetric(horizontal: 12),
                        scrollDirection: Axis.horizo
