name: Build Shop APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Flutter project if missing
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            flutter create --org com.kozwe.myshop --project-name my_shop_app temp_app
            shopt -s dotglob nullglob
            mv temp_app/* .
            rmdir temp_app
          fi

      - name: Write main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'package:flutter/material.dart';

          void main() {
            runApp(const HappinessShopApp());
          }

          class Product {
            String id;
            String name;
            String category;
            int price;
            String imageUrl;

            Product({
              required this.id,
              required this.name,
              required this.category,
              required this.price,
              required this.imageUrl,
            });
          }

          class HappinessShopApp extends StatelessWidget {
            const HappinessShopApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Happiness Shop',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(),
                home: const SplashHomePage(),
              );
            }
          }

          Future<bool> hasInternetConnection() async {
            try {
              final result = await InternetAddress.lookup('example.com')
                  .timeout(const Duration(seconds: 4));
              return result.isNotEmpty && result[0].rawAddress.isNotEmpty;
            } catch (_) {
              return false;
            }
          }

          class SplashHomePage extends StatelessWidget {
            const SplashHomePage({super.key});

            Future<void> _openSecondPage(BuildContext context) async {
              final online = await hasInternetConnection();
              if (!context.mounted) return;

              if (!online) {
                showDialog(
                  context: context,
                  builder: (ctx) => AlertDialog(
                    backgroundColor: const Color(0xFF1E1E1E),
                    title: const Text('Internet / Wi-Fi လိုအပ်ပါသည်', style: TextStyle(color: Colors.redAccent)),
                    content: const Text(
                      'ဤ App ကို အသုံးပြုရန် Internet သို့မဟုတ် Wi-Fi ဖွင့်ထားရန် လိုအပ်ပါသည်။',
                      style: TextStyle(color: Colors.white),
                    ),
                    actions: [
                      TextButton(
                        onPressed: () => Navigator.pop(ctx),
                        child: const Text('အိုကေ', style: TextStyle(color: Colors.amber)),
                      ),
                    ],
                  ),
                );
                return;
              }

              Navigator.push(
                context,
                MaterialPageRoute(builder: (_) => const SecondShopPage()),
              );
            }

            @override
            Widget build(BuildContext context) {
              const Color goldColor = Color(0xFFD4AF37);

              return Scaffold(
                backgroundColor: const Color(0xFF121212),
                body: SafeArea(
                  child: Center(
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        AspectRatio(
                          aspectRatio: 1 / 1,
                          child: Container(
                            width: 180,
                            decoration: BoxDecoration(
                              borderRadius: BorderRadius.circular(20),
                              border: Border.all(color: goldColor, width: 2),
                              color: Colors.black,
                            ),
                            child: ClipRRect(
                              borderRadius: BorderRadius.circular(18),
                              child: Image.network(
                                'https://via.placeholder.com/400x400.png?text=LOGO+1:1',
                                fit: BoxFit.cover,
                                errorBuilder: (c, e, s) => const Icon(
                                  Icons.storefront,
                                  color: goldColor,
                                  size: 80,
                                ),
                              ),
                            ),
                          ),
                        ),
                        const SizedBox(height: 22),
                        Padding(
                          padding: const EdgeInsets.symmetric(horizontal: 20),
                          child: Text(
                            'လူကြီးမင်းတို့ ပျော်ရွှင်မှုအတွက် တာဝန်ယူပါရစေ',
                            textAlign: TextAlign.center,
                            style: TextStyle(
                              color: goldColor,
                              fontSize: 20,
                              fontWeight: FontWeight.bold,
                              letterSpacing: 1.1,
                              shadows: [
                                Shadow(
                                  color: Colors.amber.withOpacity(0.45),
                                  blurRadius: 8,
                                  offset: const Offset(0, 2),
                                ),
                              ],
                            ),
                          ),
                        ),
                        const SizedBox(height: 32),
                        GestureDetector(
                          onTap: () => _openSecondPage(context),
                          child: Container(
                            constraints: const BoxConstraints(minWidth: 57, minHeight: 19),
                            padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                            decoration: BoxDecoration(
                              color: Colors.blue.withOpacity(0.15),
                              borderRadius: BorderRadius.circular(6),
                              border: Border.all(color: Colors.blueAccent, width: 1),
                            ),
                            child: const Text(
                              'ဝယ်ယူရန်',
                              style: TextStyle(
                                color: Colors.blue,
                                fontSize: 13,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class SecondShopPage extends StatefulWidget {
            const SecondShopPage({super.key});

            @override
            State<SecondShopPage> createState() => _SecondShopPageState();
          }

          class _SecondShopPageState extends State<SecondShopPage> {
            final List<Product> products = [
              Product(
                id: '1',
                name: 'ပစ္စည်း အမှတ် (၁)',
                category: 'အထွေထွေ',
                price: 15000,
                imageUrl: 'https://via.placeholder.com/500x500.png?text=Product+1',
              ),
              Product(
                id: '2',
                name: 'ပစ္စည်း အမှတ် (၂)',
                category: 'အထွေထွေ',
                price: 25000,
                imageUrl: 'https://via.placeholder.com/500x500.png?text=Product+2',
              ),
              Product(
                id: '3',
                name: 'ပစ္စည်း အမှတ် (၃)',
                category: 'အထွေထွေ',
                price: 35000,
                imageUrl: 'https://via.placeholder.com/500x500.png?text=Product+3',
              ),
              Product(
                id: '4',
                name: 'ပစ္စည်း အမှတ် (၄)',
                category: 'အထွေထွေ',
                price: 45000,
                imageUrl: 'https://via.placeholder.com/500x500.png?text=Product+4',
              ),
            ];

            void _editProductDialog(Product item) {
              final nameCtrl = TextEditingController(text: item.name);
              final catCtrl = TextEditingController(text: item.category);
              final priceCtrl = TextEditingController(text: item.price.toString());
              final imgCtrl = TextEditingController(text: item.imageUrl);

              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF1E1E1E),
                  title: const Text('ပုံနှင့် ဈေးနှုန်း ပြင်ဆင်ရန်', style: TextStyle(color: Colors.amber)),
                  content: SingleChildScrollView(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        _field(nameCtrl, 'ပစ္စည်းအမည်'),
                        const SizedBox(height: 10),
                        _field(catCtrl, 'မျိုးအစား'),
                        const SizedBox(height: 10),
                        _field(priceCtrl, 'ဈေးနှုန်း', isNumber: true),
                        const SizedBox(height: 10),
                        _field(imgCtrl, 'ဓာတ်ပုံ Link (URL)'),
                      ],
                    ),
                  ),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(ctx),
                      child: const Text('မလုပ်တော့ပါ', style: TextStyle(color: Colors.grey)),
                    ),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: Colors.amber),
                      onPressed: () {
                        setState(() {
                          if (nameCtrl.text.trim().isNotEmpty) item.name = nameCtrl.text.trim();
                          if (catCtrl.text.trim().isNotEmpty) item.category = catCtrl.text.trim();
                          final parsedPrice = int.tryParse(priceCtrl.text.trim());
                          if (parsedPrice != null) item.price = parsedPrice;
                          if (imgCtrl.text.trim().isNotEmpty) item.imageUrl = imgCtrl.text.trim();
                        });
                        Navigator.pop(ctx);
                      },
                      child: const Text('သိမ်းမည်', style: TextStyle(color: Colors.black)),
                    ),
                  ],
                ),
              );
            }

            Widget _field(TextEditingController ctrl, String label, {bool isNumber = false}) {
              return TextField(
                controller: ctrl,
                keyboardType: isNumber ? TextInputType.number : TextInputType.text,
                style: const TextStyle(color: Colors.white),
                decoration: InputDecoration(
                  labelText: label,
                  labelStyle: const TextStyle(color: Colors.white70),
                  enabledBorder: const OutlineInputBorder(borderSide: BorderSide(color: Colors.white24)),
                  focusedBorder: const OutlineInputBorder(borderSide: BorderSide(color: Colors.amber)),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(
                  backgroundColor: Colors.black,
                  title: const Text('ကုန်ပစ္စည်းများ'),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.info_outline, color: Colors.amber),
                      onPressed: () {
                        ScaffoldMessenger.of(context).showSnackBar(
                          const SnackBar(
                            content: Text('ပစ္စည်းပုံကို ဖိနှိပ် (Long Press) ၍ ပုံ URL နှင့် ဈေးနှုန်း ပြောင်းနိုင်သည်'),
                          ),
                        );
                      },
                    ),
                  ],
                ),
                body: GridView.builder(
                  padding: const EdgeInsets.all(12),
                  gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                    crossAxisCount: 2,
                    crossAxisSpacing: 12,
                    mainAxisSpacing: 14,
                    childAspectRatio: 0.85,
                  ),
                  itemCount: products.length,
                  itemBuilder: (context, index) {
                    final item = products[index];
                    return GestureDetector(
                      onTap: () {
                        Navigator.push(
                          context,
                          MaterialPageRoute(builder: (_) => ProductDetailPage(product: item)),
                        );
                      },
                      onLongPress: () => _editProductDialog(item),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.stretch,
                        children: [
                          AspectRatio(
                            aspectRatio: 1 / 1,
                            child: ClipRRect(
                              borderRadius: BorderRadius.circular(10),
                              child: Image.network(
                                item.imageUrl,
                                fit: BoxFit.cover,
                                errorBuilder: (c, e, s) => Container(
                                  color: Colors.grey[900],
                                  child: const Icon(Icons.image, color: Colors.white54, size: 40),
                                ),
                              ),
                            ),
                          ),
                          const SizedBox(height: 6),
                          Text(
                            item.name,
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis,
                            textAlign: TextAlign.center,
                            style: const TextStyle(color: Colors.white, fontWeight: FontWeight.w600),
                          ),
                        ],
                      ),
                    );
                  },
                ),
              );
            }
          }

          class ProductDetailPage extends StatelessWidget {
            final Product product;
            const ProductDetailPage({super.key, required this.product});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(
                  backgroundColor: Colors.black,
                  title: Text(product.name),
                ),
                body: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      AspectRatio(
                        aspectRatio: 4 / 3,
                        child: ClipRRect(
                          borderRadius: BorderRadius.circular(12),
                          child: Image.network(
                            product.imageUrl,
                            fit: BoxFit.cover,
                            errorBuilder: (c, e, s) => Container(
                              color: Colors.grey[900],
                              child: const Icon(Icons.image, color: Colors.white54, size: 60),
                            ),
                          ),
                        ),
                      ),
                      const SizedBox(height: 20),
                      Text(
                        '၁။ မျိုးအစား - ${product.category}',
                        style: const TextStyle(color: Colors.white, fontSize: 17),
                      ),
                      const SizedBox(height: 10),
                      Text(
                        '၂။ ဈေးနှုန်း - ${product.price}',
                        style: const TextStyle(color: Colors.amber, fontSize: 18, fontWeight: FontWeight.bold),
                      ),
                      const Spacer(),
                      SizedBox(
                        height: 50,
                        child: ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: Colors.blue),
                          onPressed: () {
                            Navigator.push(
                              context,
                              MaterialPageRoute(builder: (_) => OrderFormPage(product: product)),
                            );
                          },
                          child: const Text('မှာယူရန်', style: TextStyle(color: Colors.white, fontSize: 18)),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class OrderFormPage extends StatefulWidget {
            final Product product;
            const OrderFormPage({super.key, required this.product});

            @override
            State<OrderFormPage> createState() => _OrderFormPageState();
          }

          class _OrderFormPageState extends State<OrderFormPage> {
            final _nameCtrl = TextEditingController();
            final _addressCtrl = TextEditingController();
            final _phoneCtrl = TextEditingController();
            final _qtyCtrl = TextEditingController();

            bool _nameEmpty = false;
            bool _addressEmpty = false;
            bool _phoneEmpty = false;
            bool _qtyEmpty = false;

            void _checkEmptyFields() {
              setState(() {
                _nameEmpty = _nameCtrl.text.trim().isEmpty;
                _addressEmpty = _addressCtrl.text.trim().isEmpty;
                _phoneEmpty = _phoneCtrl.text.trim().isEmpty;
                _qtyEmpty = _qtyCtrl.text.trim().isEmpty;
              });
            }

            bool get _canSubmit => !_nameEmpty && !_addressEmpty && !_phoneEmpty && !_qtyEmpty;

            @override
            void initState() {
              super.initState();
              _checkEmptyFields();
            }

            void _submitOrder() async {
              _checkEmptyFields();
              if (!_canSubmit) return;

              final online = await hasInternetConnection();
              if (!mounted) return;
              if (!online) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Internet / Wi-Fi လိုအပ်ပါသည်')),
                );
                return;
              }

              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF1E1E1E),
                  title: const Text('မှာယူမှု ပြီးဆုံးပါပြီ', style: TextStyle(color: Colors.greenAccent)),
                  content: Text(
                    '${widget.product.name} (${_qtyCtrl.text.trim()}) ကို မှာယူပြီးပါပြီ။',
                    style: const TextStyle(color: Colors.white),
                  ),
                  actions: [
                    ElevatedButton(
                      onPressed: () => Navigator.of(ctx).popUntil((r) => r.isFirst),
                      child: const Text('ပြီးပါပြီ'),
                    ),
                  ],
                ),
              );
            }

            Widget _buildRequiredField({
              required TextEditingController controller,
              required String label,
              required bool isEmpty,
              TextInputType keyboardType = TextInputType.text,
            }) {
              return Padding(
                padding: const EdgeInsets.only(bottom: 14),
                child: TextField(
                  controller: controller,
                  keyboardType: keyboardType,
                  onChanged: (_) => _checkEmptyFields(),
                  style: const TextStyle(color: Colors.white),
                  decoration: InputDecoration(
                    labelText: label,
                    labelStyle: TextStyle(color: isEmpty ? Colors.red : Colors.white70),
                    filled: true,
                    fillColor: isEmpty ? Colors.red.withOpacity(0.18) : const Color(0xFF1A1A1A),
                    enabledBorder: OutlineInputBorder(
                      borderSide: BorderSide(color: isEmpty ? Colors.red : Colors.white24, width: isEmpty ? 2 : 1),
                    ),
                    focusedBorder: OutlineInputBorder(
                      borderSide: BorderSide(color: isEmpty ? Colors.red : Colors.blue, width: 2),
                    ),
                    errorText: isEmpty ? 'ဖြည့်စွက်ရန် လိုအပ်ပါသည်' : null,
                    errorStyle: const TextStyle(color: Colors.red),
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(
                  backgroundColor: Colors.black,
                  title: const Text('မှာယူရန်'),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      _buildRequiredField(controller: _nameCtrl, label: 'အမည်', isEmpty: _nameEmpty),
                      _buildRequiredField(controller: _addressCtrl, label: 'လိပ်စာ', isEmpty: _addressEmpty),
                      _buildRequiredField(
                        controller: _phoneCtrl,
                        label: 'ဖုန်းနံပါတ်',
                        isEmpty: _phoneEmpty,
                        keyboardType: TextInputType.phone,
                      ),
                      _buildRequiredField(
                        controller: _qtyCtrl,
                        label: 'ဘယ်လောက်ယူမလဲ',
                        isEmpty: _qtyEmpty,
                        keyboardType: TextInputType.number,
                      ),
                      const SizedBox(height: 16),
                      SizedBox(
                        height: 50,
                        child: ElevatedButton(
                          style: ElevatedButton.styleFrom(
                            backgroundColor: _canSubmit ? Colors.green : Colors.grey[800],
                          ),
                          onPressed: _canSubmit ? _submitOrder : null,
                          child: const Text('မှာပြီဗျာ', style: TextStyle(color: Colors.white, fontSize: 18)),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
